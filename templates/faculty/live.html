
{% extends "base.html" %}
{% block title %}Live Attendance{% endblock %}
{% block content %}
<div id="live" data-session-id="{{ session_id }}">
  <div class="d-flex justify-content-between align-items-center mb-3">
   <h2 class="mb-0">Live Attendance</h2>
   <button id="btn-end" class="btn btn-danger">End session</button>
  </div>
  <div class="row g-4">
   <div class="col-lg-7">
    <div class="aias-card text-center">
     <div id="qrcode" class="d-flex justify-content-center"></div>
     <p class="mt-3 mb-0 fs-5">New code in <strong id="countdown">-</strong> s</p>
     <div id="ended-msg" class="alert alert-secondary mt-3 d-none">Session ended</div>
    </div>
   </div>
   <div class="col-lg-5">
    <div class="aias-card">
     <h4><span id="count-present">0</span> present &middot; <span id="count-flagged">0</span>
flagged</h4>
     <p class="text-muted">of <span id="count-total">-</span> students</p>
     <ul id="marked-list" class="list-group"></ul>
    </div>
   </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="{{ url_for('static', filename='js/live_qr.js') }}"></script>
{% endblock %}
