
{% extends "base.html" %}
{% block title %}Scan Attendance{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 480px">
 <h2 class="mb-3 text-center">Scan Attendance</h2>

 <div id="scan-view">
  <div class="aias-card">
   <div id="reader" style="width: 100%"></div>
   <p id="status-msg" class="text-center text-muted mt-2 mb-1">Starting camera...</p>
   <p id="loc-status" class="text-center small mb-0">Location: checking...</p>
  </div>

  <details class="aias-card mt-3">
   <summary>Camera not working? Enter the code by hand</summary>
   <div class="input-group mt-2">
    <input id="manual-token" class="form-control" placeholder="Paste the code here">
    <button id="btn-manual" class="btn btn-primary" type="button">Submit</button>
   </div>
  </details>
 </div>

 <div id="result-view" class="d-none">
  <div class="aias-card text-center">
   <div id="result-icon" style="font-size: 72px; line-height: 1"></div>
   <h3 id="result-title" class="mt-2"></h3>
   <p id="result-reason" class="mb-1"></p>
   <p id="result-distance" class="text-muted small"></p>
   <button id="btn-again" class="btn btn-primary mt-2" type="button">Scan again</button>
   <a href="{{ url_for('student.dashboard') }}" class="btn btn-outline-secondary mt-2">Dashboard</a>
  </div>
 </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="{{ url_for('static', filename='js/scan.js') }}"></script>
{% endblock %}
