
{% extends "base.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}

<h2 class="mb-4">Admin, {{ user.name }}</h2>

<div class="row g-3">

    <div class="col-md-6">

        <div class="aias-card">

            <h5>Suspicious attempts</h5>

            <p class="text-muted">
                Rejected and flagged scans, newest first.
            </p>

            <a href="{{ url_for('admin.attempts') }}"
               class="btn btn-primary">
                View attempts
            </a>

        </div>

    </div>

    <div class="col-md-6">

        <div class="aias-card">

            <h5>Users</h5>

            <p class="text-muted">
                Everyone who can log in.
            </p>

            <a href="{{ url_for('admin.users') }}"
               class="btn btn-outline-primary">
                View users
            </a>

        </div>

    </div>

</div>

{% endblock %}
